name: Automated Knowledge Base Ingestion

on:
  schedule:
    - cron: '0 2 * * *'  # Runs at 2:00 AM UTC every day
  workflow_dispatch:     # Allows you to click a "Run Workflow" button manually in GitHub UI

jobs:
  ingest-to-pinecone:
    if: github.repository != '' # prevent running on forks by default if needed
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚀 Checkout Repository
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -r requirements.txt

      - name: 🧠 Run Ingestion Pipeline (Drive → Pinecone)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          PINECONE_INDEX_NAME: karan-systems-data
        run: |
          # Set PYTHONPATH so the config.py and rag/ modules can be found
          PYTHONPATH=. python rag/ingest.py
